name: portfolio-prod

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: portfolio:latest
    container_name: portfolio-prod
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    # env_file:
    #   - .env.production
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
