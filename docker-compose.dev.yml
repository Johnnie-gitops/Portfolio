name: portfolio-dev

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: portfolio-dev
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true   # hot reload on Windows/macOS bind mounts
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    restart: unless-stopped
